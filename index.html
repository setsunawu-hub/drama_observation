:root{--bg:#14121a;--card:#1e1b28;--line:#2e2a3d;--tx:#ece8f5;--mu:#9b94b3;--ac:#e08bb0;--ac2:#8ab4e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"Noto Sans TC","PingFang TC",sans-serif}
header{padding:28px 18px 8px;max-width:1100px;margin:auto}

.sub{color:var(--mu);font-size:13px}
main{max-width:1100px;margin:auto;padding:0 14px 60px}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.still{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#2a2440,#1a1726);border:1px dashed var(--line);display:flex;flex-direction:column;justify-content:flex-end}
.still.wide{grid-column:span 2;aspect-ratio:3/2}
.still.has{border:1px solid var(--line)}
.still img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.still .cap{position:relative;pointer-events:none;padding:28px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12.5px}
.still .cap b{display:block;font-size:13.5px}
.still .act{position:absolute;bottom:6px;right:6px;display:flex;gap:4px;z-index:2}
.btn{background:rgba(20,18,26,.85);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11.5px;cursor:pointer;text-decoration:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;text-align:center;padding:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:14px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px}
.chip.on{color:#fff;background:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.c h3{margin:0;font-size:15.5px}
.c .zh{color:var(--ac2);font-size:14px}
.meta{color:var(--mu);font-size:12.5px;margin-top:4px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin:5px 4px 0 0;background:#2b2740;color:#cfc8ea}
.tag.rec{background:#5b2a45;color:#ffc9e0}.tag.ep{background:#4a3a1f;color:#ffe2a8}.tag.ost{background:#23405a;color:#bfe0ff}.tag.done{background:#24472f;color:#c4f0cf}
.plot{font-size:13px;color:#cfc9e3;margin-top:6px}
.car{float:right;margin:0 0 6px 10px;width:120px;position:relative}.car .tr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:8px;border:1px solid var(--line)}.car .tr::-webkit-scrollbar{display:none}.car .tr img{flex:0 0 100%;width:100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:center}.car .dl{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;text-decoration:none}.car .cn{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px}.th{float:right;margin:0 0 6px 10px;display:flex;gap:4px}.th img{width:64px;height:88px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.still{cursor:pointer}@keyframes capOut{to{transform:translateY(100%);opacity:0}}.still.seen .cap{animation:capOut .6s ease 3s forwards}.still:hover .cap,.still:not(.has) .cap{animation:none;opacity:1;transform:none}.c.flash{outline:2px solid var(--ac);transition:outline .3s}
.sec{display:none}.sec.show{display:block}
details summary{cursor:pointer;color:var(--ac2);font-size:12.5px;margin-top:6px}
footer{color:var(--mu);font-size:12px;text-align:center;padding:20px}
</style>

  ["His Forbidden Officer","他的禁忌警官","nushort","Samuel Brooks × Nolan Price","二搭（前作《王室的禁忌獵物》）；已完結；25 集。","","孤島上的斯通海文監獄，犯人接連離奇死亡。白鹿獄警塞繆爾剛到任，第一項任務就是給即將轉押重刑區的黑豹囚犯諾蘭搜身。這個滿嘴撩撥的掠食者身手卻像受過警方訓練。典獄長手裡的神秘藥物R-07浮出水面，一鹿一豹在獵物與獵手之間越靠越近，可兩人都藏著不能說的秘密。",""],

  ["Mafia Contract IV: The Mafia Psycho’s Contract Doctor","黑契第四季","MoreShort","Joey × Jasper","隸屬「黑手黨契約系列」"],

  ["Caught in His Current","逆浪之縛","ReelShort／nushort","Leo × Ruslan","44 集；標籤：競技；尺度：⚠️在外面不要開。","","衝浪天王利奧被神秘新秀魯斯蘭奪走冠軍，竟發現他就是那一夜纏綿的陌生人。兩人被迫同隊訓練，禁忌愛火一觸即發，卻雙雙被背後的財團與養父牢牢控制。為了解救魯斯蘭脫離魔掌，利奧賭上一切，最終在50公尺的巨浪之巔，用一吻向全世界聲明：他們的愛，誰也拆不散。",""],
  ["The Gun & The Cross","槍與十字架","ShortWave／nushort","Ian × Dante","神學院學生 × 黑幫老大；30 集；已完結；標籤：黑幫、禁忌關係、復仇；尺度：清水。","","五歲那年，伊恩的母親被吸毒的生父賣給黑幫。十五年後，成了神學生的伊恩恨透了黑幫，卻在一個夜裡救下受傷的男人但丁，年輕的黑幫教父。但丁一眼認定這個純潔的小修士，要他歸自己所有。伊恩一邊被他步步逼近，一邊追查母親遇害的真相，才發現自己恨錯了人。",""],
  ["Trapped by the Alpha Twins","深陷Alpha兄弟","nushort","Leo／Kyle × Noah","AI真人；已完結；21 集。二攻一受：Noah（兔族青年）為受，Leo（養兄）與 Kyle 為雙胞胎兄弟，皆為攻。","","兔族青年Noah憑實力考入帝國軍事學院作戰系，想借學院檔案查清父母遇害的真相。養兄Leo處處與他作對，Kyle卻始終護著他。一次精神力失控，讓Noah發現自己遠比想像中強大，也把三人捲進危險的秘密與複雜的感情之中。面對不斷逼近的威脅，他必須弄清自己能信任誰。"],
  ["The Duke’s Substitute Groom","公爵的替身新郎","Anamana","Alexander × Duke Cassian","已完結；30 集；另有 8 集番外；標籤：替嫁。製作：Studio psychoNova","#8 Duke Cassian（攻）× Alexander（受）"],

  ["Godfather's Alpha Lover","暗殺令","DramaWave／nushort","Damiano Castellano × Lucian","Lucian 為受；45 集；標籤：黑幫。","","身為蛇族後裔的黑手黨教父，與敵對陣營中被稱為「狂狼」的養子陷入致命糾葛。從一開始的刀刃相向、暗殺伏擊與殘酷囚禁，到為了利益不得不達成的暗黑交易，兩人在充滿鮮血與背叛的權力泥淖中，逐漸失控地滋生出超越敵對陣營的禁忌狂愛，展開一場驚心動魄的宿命之戀。",""],

  ["The End of Grace","恩寵收回","SarosTV／nushort","Enzo Mancini × Marco Ash","41 集；標籤：黑幫、商戰片。","","生日當晚，港口黑幫老大恩佐・曼奇尼又一次被戀人盧卡丟下——只因為文森特一通醉酒電話。三年的付出被徹底寒透，恩佐把盧卡掃地出門，切斷與維托家的一切往來，並追討三千萬欠款。走投無路的盧卡和維托家越陷越深，掉進文森特精心設計的基金與名畫騙局，而恩佐冷眼收網，要揪出文森特背後真正的操盤手，也在實幹的物流商人馬爾科・阿什身上看到了新的可能。",""],

  ["Pirate Captain, Don’t Fall for Your Untamed Prey","海盜船長的專屬獵物","nushort","Julian / Arther","30 集；標籤：甜寵。","","十年前家破人亡的朱利安，被貴族少爺亞瑟救下一命；如今他已是令人聞風喪膽的海盜王。亞瑟奉命潛上海盜船偷取航海圖，卻不知道朱利安第一眼就認出了他。被俘的亞瑟一邊被這個海盜王百般戲弄，一邊漸漸看清：海盜看重的忠誠，遠比帝國的冠冕堂皇更真。"],
  ["Detective’s Fever Game: Hunt the Doctor","偵探的狂熱遊戲：追獵醫生","NetShort／nushort","Sherlock Gomes / John Watson","British English（先給 60 分）；倫敦背景，貧苦法醫與富有聰明偵探，故事線緊湊。40 集；標籤：懸疑、一夜情。","","法醫 John Watson 剛跟出軌的丈夫奧古斯特當眾鬧翻，一氣之下隨便帶了個男人回家，醒來才知道對方是總部派來偵辦「翡翠玫瑰」連環殺人案的顧問偵探 Sherlock Gomes。白天在解剖台前一起查案，夜裡糾纏不清，兩人聯手追捕這個讓全城陷入恐慌的殺…（截圖簡介至此）"],

  ["The Husky Who Strayed Into Wolf Pack","誤入狼群的哈士奇","StoReel／nushort","Vaughn × Caelan","第一季；30 集；標籤：狼人、清水。同系列：番外篇（15 集）、二搭《誤入魔法學院的哈士奇》（40 集）。","","哈士奇獸人凱蘭被賭鬼繼父賣掉抵債。逃避討債人時，他跌落懸崖，誤闖狼群禁地。為了活命，他偽裝成狼人，在殘酷的「狼後試煉」中拼命爭取一席之地。他不知道的是，狼王沃恩在十年前他還是幼崽時救過他一命，而他正是沃恩的命定伴侶，唯一能平息沃恩滿月狂暴的人。熬過試煉只是開始，凱蘭被捲進一場威脅整個狼群存亡的風暴——狼群裡藏著叛徒。最終，凱蘭的勇氣與純真打破了種族偏見，他和沃恩揪出叛徒，帶領狼群衝破牢籠，迎來新的黎明。",""],

{t:"認知與健康警示：高頻短影音使用與注意力分散、執行功能較弱及情緒調節困難有關；腦造影研究顯示，觀看偏好的短影音時，認知控制相關腦區（背側前扣帶皮質、背外側前額葉）活動下降。",s:"part",n:"已刪除未找到證據的「決策衝動」與「長輩分不清虛構與現實」。以下為同儕審查文獻：Psychological Bulletin 151(9), 1125–1146 的統合分析；2026 年系統性回顧（PubMed）指出較高使用量與注意力碎片化、較低執行控制標記相關，但證據屬初步、研究間差異大；NeuroImage 327（2026）121722 的 fMRI＋MRS 研究。皆針對短影音而非 AI 微短劇，且為相關性研究，不能證明因果。",l:[["Psychological Bulletin 統合分析（短影音認知與心理健康）","https://psycnet.apa.org/fulltext/2026-89350-001.html"],["短影音、認知與心理健康：系統性回顧（PubMed）","https://pubmed.ncbi.nlm.nih.gov/42781066"],["Int. J. Adolescence and Youth：短影音成癮與認知（23 項研究）","https://www.tandfonline.com/doi/full/10.1080/02673843.2026.2623337"],["NeuroImage 2026：短影音觀看抑制認知控制腦區","https://www.sciencedirect.com/science/article/pii/S1053811926000406"],["香港01","https://www.hk01.com/數碼生活/60377342/ai短劇成新一代毒品-爆點不停爽到飛-精神科醫生揭大腦恐怖變化"],["聯合新聞網","https://udn.com/news/story/6841/9770472"]]},

{t:"Zhou（2026）《The Era of Short Dramas…》：多巴胺閾值上升 37%、前額葉神經連結密度下降 18%、史丹佛邏輯測驗錯誤率上升。",s:"flag",n:"論文存在（Pinnacle Academic Press Proceedings Series, vol.10, pp.265-273），但摘要未提到 37%、18% 或史丹佛測驗；摘要結論是好壞並存（部分情況有助邏輯與敘事追蹤，也有膚淺化風險）。這些數字未經核實，引用前請讀全文。",l:[["EconPapers 頁面","https://econpapers.repec.org/RePEc:dba:pappsa:v:10:y:2026:i::p:265-273"],["全文 PDF","https://pinnaclepubs.com/index.php/PAPPS/article/view/654/632"]]},
{t:"未完成感與懸念：結尾懸念被認為會提高續看動力；精神科醫師楊聰財指出，夜間自控力下降時更難停下。",s:"part",n:"已刪除未找到出處的鄒瑩「每 3–5 秒轉折」與 BDNF 下降風險，以及「觸發大腦對未知獎賞的期待」這類未經驗證的機制斷言。學術面：Wirz（2022）直接測試懸念結尾對續看意願的影響；Planning-to-Binge（2024）則指出追劇多為事前計畫而非單純失控，是需併陳的反向證據。變動比率增強屬行為心理學機制，尚未找到針對微短劇的實證。",l:[["Wirz（2022）：懸念結尾實驗","https://sonar.ch/documents/319990/files/2022_Wirz_Role.pdf"],["Planning-to-Binge（JEP: Applied, 2024）","https://escholarship.org/uc/item/8fq9t7fd"],["鏡週刊／健康醫療網","https://www.mirrormedia.mg/external/healthnews_69486"],["元氣網","https://health.udn.com/health/story/5964/9689697"],["香港01","https://www.hk01.com/數碼生活/60377342/ai短劇成新一代毒品-爆點不停爽到飛-精神科醫生揭大腦恐怖變化"]]},
{t:"Wei 等（npj Science of Learning，2026）：看拆成多支的短影音，比看同長度連續影片的事後記憶更差，且與記憶提取相關腦區的活動與連結較弱。",s:"part",n:"僅透過 PsyPost 的報導核對，沒讀到期刊原文。57 位大學生隨機分兩組：連續 10 分鐘影片 vs 7 支共 10 分鐘的短影片，之後在 fMRI 中回答選擇題。連續組答對約 66%，短影片組約 43%；短影片組在左側屏狀核、尾狀核、顳中回活動較低，尾狀核與屏狀核連結較弱。限制：年輕大學生、兩種格式敘事節奏無法完全對等、分組間基線差異無法排除、各組人數未報。對照意義：它比的是「碎片化 vs 連續」，微短劇是「碎片化的每集＋連續的整部劇」，不能直接套用。",l:[["PsyPost 報導","https://www.psypost.org/brain-scans-reveal-how-short-videos-impair-memory-and-disrupt-neural-pathways/"]]},
{t:"He 等（Frontiers in Human Neuroscience，2026）：每天看短影音較多的年輕人，靜息態腦網絡連結較強、整體效率較高，但意義未明。",s:"part",n:"僅透過 PsyPost 的報導核對，沒讀到期刊原文。55 位成人（平均 21.6 歲）靜息態 fMRI；每天少於 1 小時（20 人）對 1 至 3 小時（35 人，無人超過 3 小時）。高使用組多個網絡連結較強，右下額回部分區域（與行為控制有關）活動較低，全腦效率與聚集係數較高。作者未測注意力或記憶，因此無法說是好是壞；效率較高過去也與智力、工作記憶有關。這是關聯研究，1 小時門檻只是分組用，不代表成癮。",l:[["PsyPost 報導","https://www.psypost.org/frequent-short-video-viewers-show-altered-brain-function/"]]}

{t:"對比效應：看多完美 AI 臉（平均臉、對稱、幼態）後覺得真人「變醜」，唐義誠解釋為對比效應與社會比較（央視網／ETtoday）。",s:"tbd",n:"兩篇原文未找到，連結待確認。",l:[]},
{t:"Frontiers in Psychology（Zhou 等，2026）：感知壓力透過狀態無聊預測問題性觀看微短劇，孤獨感調節路徑。",s:"ok",n:"已讀到論文頁面。781 位中國大學生（平均 21.1 歲，50.83% 女性），五所大學便利取樣，橫斷面問卷，PROCESS Model 7。感知壓力與問題性觀看正相關（r=0.352）；狀態無聊的間接效應 0.136，占總效應 15.03%；孤獨感調節壓力到無聊的路徑（β=0.138），高孤獨者路徑顯著、低孤獨者不顯著。限制：橫斷面無法確立因果，反向（看劇增加壓力）同樣合理；全為自陳；間接路徑只解釋約 15%，衝動性、FoMO、逃避動機等未測；問題性觀看量表為新改編，其中一個子量表 AVE 低於 0.5 的常用門檻。",l:[["Frontiers in Psychology（2026）全文","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1808559/full"]]}

{t:"高齡者的擬社會互動與孤獨感：關聯方向因媒體類型與個人特質而異。",s:"part",n:"已刪除未核實的「WHO 警示」與「依賴」說法。文獻結果並不一致：中高齡女性電視購物者的擬社會互動與以購物緩解孤獨有關（Asia Marketing Journal, 2017，n=109）；高齡者與討厭角色的擬社會關係可預測憂鬱與孤獨增加，並受依附風格與感情品質調節（2019 年研究）；經驗取樣研究（PMC12760267）顯示媒體使用與整體孤獨感較高相關，但獨處時較低，尤其在高齡者。皆非針對 AI 短劇。",l:[["Asia Marketing Journal（2017）：電視購物與孤獨","https://doaj.org/article/7bbd98e5b4f840748e1fd58e9da0d8d1"],["2019：高齡者與討厭角色的擬社會關係","https://informahealthcare.com/doi/full/10.1080/00909882.2019.1679384"],["媒體使用與獨處時孤獨感（經驗取樣，PMC）","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12760267/"],["聯合新聞網：長輩沉迷 AI 短影音","https://udn.com/news/story/6841/9770472"],["世界日報","https://www.worldjournal.com/wj/story/121617/9674302"]]},
{t:"漢斯《人工智能生成微短劇在國際中文教育中的應用研究》：43% 年輕重度觀看者視極端劇情為可行方案。",s:"flag",n:"論文存在，但內容是 AI 微短劇用於國際中文教育（CALL／TPACK、Seedance 2.0）；未見 43% 這類觀看者實驗，與本主題不符，請勿據此引用。",l:[["漢斯 PDF","https://pdf.hanspub.org/ae_1884322.pdf"]]},
{t:"Hua 等（Frontiers in Psychology，2026 年 10 月）：微短劇敘事投入與大學生婚姻焦慮，經「愛情現實比較」與「擇偶物質主義」的小幅間接關聯。",s:"ok",n:"已讀到論文頁面。2,015 位中國大專學生，2026 年 1 月線上問卷（便利與滾雪球取樣），SEM。敘事投入與愛情現實比較正相關（β=0.614），後者與擇偶物質主義（β=0.358）、婚姻焦慮（β=0.281）正相關；整條連續間接路徑很小（B=0.034，標準化 0.031）。媒體識讀與這些變項負相關，但交互作用不顯著。作者提醒：投入到婚姻焦慮的直接殘餘路徑為小幅負值，不能解讀為「看劇降低焦慮」。限制：橫斷面、全為自陳、非機率取樣；投入量表問的是一般微短劇，不是愛情題材；量表為自編，部分題項概念重疊。",l:[["Frontiers in Psychology（2026）全文","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1929861/full"]]}

{t:"神經科學：新論文支持「短影音的碎片化」相關議題，但不能直接外推到序列式的 AI BL 短劇。",s:"an",n:"Wei 的記憶差異（66% vs 43%）比的是碎片化 vs 連續；He 的靜息態結果方向不明；原有的 NeuroImage（Hu 等，2026）是看喜好短影音時認知控制腦區活動下降。三者都是一般短影音，而報告第零節的定位是：微短劇每集短、整部連續看，更接近連續劇。所以這些腦科學證據只能算「相鄰證據」，不是微短劇直接證據。",l:[]},

{t:"對你的研究設計的建議：把壓力、無聊、孤獨、現實比較、媒體識讀列為候選變項，並加入「連續 vs 碎片」的對照。",s:"an",n:"這是我根據上述論文提出的建議，不是論文結論：Zhou 與 Hua 的量表可作為問卷參考；Wei 的設計（同長度、連續 vs 碎片）可啟發你的對照組；樣本應改為有 AI BL 短劇觀看經驗的成年女性，因為現有證據幾乎全來自大學生，外推到你的對象需要自己的資料。",l:[]}
